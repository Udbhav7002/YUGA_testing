<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>YUGA Platform — Rooms</title>
<style>
  :root {
    --bg: #0e1013; --panel: #15181d; --panel2: #191d23; --line: #232830;
    --txt: #ccd2da; --dim: #7a828c; --faint: #4a515b;
    --accent: #5b8def; --ok: #42926b; --warn: #b98a2e; --bad: #c0564f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg); color: var(--txt); padding: 48px 24px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: 3px; }
  .brand small { display: block; font-size: 11px; font-weight: 400; letter-spacing: .4px;
    color: var(--faint); margin-top: 3px; }
  .status { font-size: 11.5px; color: var(--dim); }
  .status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .card h3 { font-size: 14.5px; font-weight: 600; }
  .card .meta { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 14px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px;
    transition: width .5s ease; width: 0; }
  .bar i.hot { background: var(--warn); }
  .pct { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { font: inherit; font-size: 12.5px; font-weight: 500; color: var(--txt);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; cursor: pointer; transition: border-color .15s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: wait; }
  .incident { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 10px;
    border: 1px solid #c0564f66; background: #1a0d0d; }
  .incident.show { display: block; }
  .incident .headline { color: #e8b0ab; font-weight: 600; font-size: 13.5px; }
  .incident .detail { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .incident .detail code { font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--bad); font-size: 11.5px; }
  .notice { display: none; margin-top: 14px; padding: 12px 16px; border-radius: 10px;
    border: 1px solid #b98a2e66; background: #1a1608; color: var(--warn); font-size: 12.5px; }
  .notice.show { display: block; }
  .agent { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); }
  .agent.show { display: block; }
  .agent-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .agent-title { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .agent-status { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  .agent-status b { color: var(--accent); font-weight: 500; }
  .agent-stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 11.5px; color: var(--faint); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--faint); }
  .chip.done { color: var(--ok); border-color: #42926b55; }
  .chip.done::before { background: var(--ok); border-color: var(--ok); }
  .chip.active { color: var(--accent); border-color: #5b8def66; }
  .chip.active::before { background: var(--accent); border-color: var(--accent); animation: blink 1.1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .agent-foot { margin-top: 10px; font-size: 12.5px; color: var(--dim); min-height: 16px; }
  .agent-foot a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .agent-foot .ok { color: var(--ok); font-weight: 600; }
  .agent-foot .warn { color: var(--warn); font-weight: 600; }
  .agent-foot .bad { color: var(--bad); font-weight: 600; }
  footer { margin-top: 36px; color: var(--faint); font-size: 11.5px; }
</style>
<body><div class="wrap">
  <header>
    <div class="brand">YUGA PLATFORM<small>room booking · internal tooling</small></div>
    <div class="status"><i></i>all systems normal</div>
  </header>

  <div class="grid" id="rooms"></div>

  <div class="incident" id="incident">
    <div class="headline">Request failed — our team has been notified</div>
    <div class="detail">Incident <code id="incidentId">—</code> reported to CodeGhost. Engineers will follow up.</div>
  </div>
  <div class="agent" id="agent">
    <div class="agent-head">
      <span class="agent-title">CodeGhost — autonomous response</span>
      <span class="agent-status" id="agentStatus">connecting…</span>
    </div>
    <div class="agent-stages" id="agentStages"></div>
    <div class="agent-foot" id="agentFoot"></div>
  </div>
  <div class="notice" id="notice"></div>

  <footer>Demo deployment · every request is real · failures are real failures</footer>
</div>

<script>
async function loadRooms() {
  const res = await fetch('/rooms');
  const rooms = await res.json();
  document.getElementById('rooms').innerHTML = rooms.map(r => `
    <div class="card">
      <h3>${r.name}</h3>
      <div class="meta">${r.booked} / ${r.capacity} booked</div>
      <div class="bar"><i id="bar-${r.id}"></i></div>
      <div class="pct" id="pct-${r.id}">occupancy — not checked</div>
      <div class="row">
        <button onclick="checkOccupancy('${r.id}', this)">Check occupancy</button>
        <button class="primary" onclick="book('${r.id}', this)">Book</button>
      </div>
    </div>`).join('');
}

async function checkOccupancy(id, btn) {
  btn.disabled = true;
  hideIncident(); hideNotice();
  try {
    const res = await fetch(`/rooms/${id}/occupancy`);
    const data = await res.json();
    if (!res.ok) {
      showIncident(data.crash_id || 'unknown');
    } else {
      const pct = data.occupancy_pct;
      const bar = document.getElementById(`bar-${id}`);
      bar.style.width = pct + '%';
      bar.classList.toggle('hot', pct >= 90);
      document.getElementById(`pct-${id}`).textContent = `occupancy ${pct}%`;
    }
  } catch (e) {
    showIncident(null);
  }
  btn.disabled = false;
}

async function book(id, btn) {
  btn.disabled = true;
  hideIncident(); hideNotice();
  try {
    const res = await fetch('/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room_id: id, employee: 'demo-user' }),
    });
    if (res.status === 409) {
      const d = await res.json();
      showNotice(`Booking declined — ${d.detail}.`);
    } else if (res.ok) {
      showNotice('Room booked for demo-user.');
      loadRooms();
    } else {
      showNotice(`Booking declined (${res.status}).`);
    }
  } catch (e) {
    showNotice('Network error — try again.');
  }
  btn.disabled = false;
}

const ORCH = `http://${location.hostname}:8004`;
const AGENT_STAGES = [
  ['received', 'intercepted'], ['reading_source', 'source read'],
  ['generating_test', 'test written'], ['running_failing_test', 'red run'],
  ['generating_fix', 'fix written'], ['verifying_fix', 'green run'],
  ['opening_pr', 'PR opened'],
];
let agentTimer = null;

function showIncident(cid) {
  document.getElementById('incidentId').textContent = cid || '—';
  document.getElementById('incident').classList.add('show');
  document.querySelector('.status i').style.background = 'var(--bad)';
  document.querySelector('.status').childNodes[1].textContent = 'incident reported';
  if (cid) trackAgent(cid);
}

function trackAgent(crashId) {
  const panel = document.getElementById('agent');
  panel.classList.add('show');
  document.getElementById('agentStages').innerHTML =
    AGENT_STAGES.map((s, i) => `<span class="chip" id="chip-${i}">${s[1]}</span>`).join('');
  document.getElementById('agentFoot').innerHTML = '';
  document.getElementById('agentStatus').textContent = 'report sent · waiting for orchestrator…';
  if (agentTimer) clearInterval(agentTimer);
  const t0 = Date.now();
  let jobId = null;
  agentTimer = setInterval(async () => {
    const waited = (Date.now() - t0) / 1000;
    try {
      if (!jobId) {
        const last = await (await fetch(`${ORCH}/status/last`)).json();
        if (last.crash_id === crashId) { jobId = last.job_id; }
        else if (waited > 12) {
          document.getElementById('agentStatus').textContent =
            'no job accepted — duplicate crash suppressed (5-min cooldown)';
          clearInterval(agentTimer);
          return;
        } else {
          document.getElementById('agentStatus').textContent =
            `report sent · waiting for orchestrator (${waited.toFixed(0)}s)`;
          return;
        }
      }
      const job = await (await fetch(`${ORCH}/status/${jobId}`)).json();
      const final = ['fixed', 'draft_pr', 'failed', 'error'].includes(job.status);
      const cur = AGENT_STAGES.findIndex(s => s[0] === job.stage);
      AGENT_STAGES.forEach((s, i) => {
        const c = document.getElementById(`chip-${i}`);
        c.className = 'chip' + (final || i < cur ? ' done' : i === cur ? ' active' : '');
      });
      if (final) {
        clearInterval(agentTimer);
        const foot = document.getElementById('agentFoot');
        if (job.status === 'fixed') {
          document.getElementById('agentStatus').innerHTML = `resolved in <b>${job.elapsed}s</b>`;
          foot.innerHTML = `<span class="ok">Fix verified — regression test red before, green after.</span> <a href="${job.pr_url}" target="_blank">View pull request →</a>`;
        } else if (job.status === 'draft_pr') {
          document.getElementById('agentStatus').innerHTML = `draft in <b>${job.elapsed}s</b>`;
          foot.innerHTML = `<span class="warn">Fix unverified — opened as draft for human review.</span> <a href="${job.pr_url}" target="_blank">View draft →</a>`;
        } else {
          document.getElementById('agentStatus').textContent = 'stopped';
          foot.innerHTML = `<span class="bad">${job.status === 'failed' ? job.reason || 'pipeline stopped' : job.error || 'error'}</span>`;
        }
      } else {
        document.getElementById('agentStatus').innerHTML =
          `agent working — <b>${job.stage.replace(/_/g, ' ')}</b> · ${waited.toFixed(0)}s`;
      }
    } catch (e) {}
  }, 800);
}

function showNotice(msg) {
  const n = document.getElementById('notice');
  n.textContent = msg; n.classList.add('show');
}
function hideIncident() {
  document.getElementById('incident').classList.remove('show');
  document.getElementById('agent').classList.remove('show');
  if (agentTimer) clearInterval(agentTimer);
  document.querySelector('.status i').style.background = 'var(--ok)';
  document.querySelector('.status').childNodes[1].textContent = 'all systems normal';
}
function hideNotice() { document.getElementById('notice').classList.remove('show'); }

loadRooms();
</script>
</body></html>
