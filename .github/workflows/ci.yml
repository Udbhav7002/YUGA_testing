name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      # The regression tests in tests/ were generated by CodeGhost pipeline
      # runs and exercise the app via FastAPI's TestClient — no external
      # services needed (Presidio scrubbing degrades to a no-op here).
      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Lint (real errors only)
        run: ruff check --select F,E9 .
